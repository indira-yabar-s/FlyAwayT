services:
  postgres:
    image: postgres:16
    container_name: flyaway-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-flyaway}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - flyaway-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-flyaway}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flyaway-postgres-data:
