spring.application.name=FlyAwayT
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flyaway}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:FlyAwayTravelLabSecretKeyMustBeAtLeast64CharactersLongForHS512SigningKey}
jwt.expiration-access=${JWT_EXPIRATION_ACCESS:3600000}
